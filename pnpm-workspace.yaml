packages:
  - api/*
  - examples/*
  - examples/web-platform/packages/*
  - examples/with-solidjs/packages/*

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  dprint: true
  esbuild: true

catalog:
  "@lynx-js/external-bundle-rsbuild-plugin": "0.4.1"
  "@lynx-js/lynx-bundle-rslib-config": "0.7.0"
  "@lynx-js/react-umd": "0.124.0"
  "@lynx-js/qrcode-rsbuild-plugin": "0.6.0"
  "@lynx-js/react-use": "0.2.2"
  "@lynx-js/react": "0.124.0"
  "@lynx-js/react-rsbuild-plugin": "0.19.0"
  "@lynx-js/rspeedy": "0.16.4"
  "@lynx-js/types": "4.1.0"
  "@lynx-js/template-webpack-plugin": "0.15.1"
  "@lynx-js/type-element-api": "0.0.10"
  "@lynx-js/vanilla-rsbuild-plugin": "0.0.1"
  "@lynx-js/runtime-wrapper-webpack-plugin": "0.2.3"
  "@lynx-js/config-rsbuild-plugin": "0.2.2"
  "@rsbuild/plugin-sass": "2.0.1"

minimumReleaseAgeExclude:
  - "@lynx-js/*"
