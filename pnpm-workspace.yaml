packages:
  - api/*
  - examples/*
  - examples/web-platform/packages/*
  - examples/with-solidjs/packages/*

strictPeerDependencies: true
engineStrict: true

# We are using flatten config of eslint and not using prettier
# Disable the default publicHoistPattern(*-eslint-*, *-prettier-*)
publicHoistPattern: []

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  dprint: true
  esbuild: true

catalog:
  "@lynx-js/external-bundle-rsbuild-plugin": "0.4.2"
  "@lynx-js/lynx-bundle-rslib-config": "0.8.1"
  "@lynx-js/react-umd": "0.126.0"
  "@lynx-js/qrcode-rsbuild-plugin": "0.7.1"
  "@lynx-js/react-use": "0.2.2"
  "@lynx-js/react": "0.126.0"
  "@lynx-js/react-rsbuild-plugin": "0.20.1"
  "@lynx-js/rspeedy": "0.17.1"
  "@lynx-js/types": "4.2.1"
  "@lynx-js/template-webpack-plugin": "0.16.0"
  "@lynx-js/testing-environment": "0.3.4"
  "@lynx-js/type-element-api": "0.0.10"
  "@lynx-js/vanilla-rsbuild-plugin": "0.1.0"
  "@lynx-js/runtime-wrapper-webpack-plugin": "0.2.4"
  "@lynx-js/config-rsbuild-plugin": "0.2.3"
  "@rsbuild/plugin-sass": "2.0.1"

minimumReleaseAgeExclude:
  - "@lynx-js/*"
  - "@dprint/*"
  - dprint@0.57.1
